{{- if and .Values.controlPlane.machineHealthCheck .Values.controlPlane.machineHealthCheck.enabled }}
{{- if not .Values.controlPlane.machineHealthCheck.checks }}
{{- fail "controlPlane.machineHealthCheck.checks is required when machineHealthCheck.enabled=true" }}
{{- end }}
{{- $mhcName := include "capvs-vanilla-cluster.childName" (dict "root" . "suffix" "-control-plane-mhc") }}
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineHealthCheck
metadata:
  name: {{ $mhcName }}
  namespace: {{ .Release.Namespace }}
  labels:
    cluster.x-k8s.io/cluster-name: {{ include "capvs-vanilla-cluster.clusterName" . | quote }}
    {{- include "capvs-vanilla-cluster.labels" . | nindent 4 }}
spec:
  clusterName: {{ include "capvs-vanilla-cluster.clusterName" . | quote }}
  checks:
    {{- toYaml .Values.controlPlane.machineHealthCheck.checks | nindent 4 }}
  {{- with .Values.controlPlane.machineHealthCheck.remediation }}
  remediation:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: {{ include "capvs-vanilla-cluster.clusterName" . | quote }}
      cluster.x-k8s.io/control-plane-name: {{ include "capvs-vanilla-cluster.childName" (dict "root" . "suffix" "-control-plane") | quote }}
{{- end }}
