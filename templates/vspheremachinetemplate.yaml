{{- range $groupName, $group := .Values.workerNodes }}
{{- $name := include "capvs-vanilla-cluster.childName" (dict "root" $ "suffix" (printf "-%s" $groupName)) }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: VSphereMachineTemplate
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    cluster.x-k8s.io/cluster-name: {{ include "capvs-vanilla-cluster.clusterName" $ | quote }}
    cluster.x-k8s.io/deployment-name: {{ $name | quote }}
    {{- include "capvs-vanilla-cluster.labels" $ | nindent 4 }}
spec:
  template:
    spec:
      {{- include "capvs-vanilla-cluster.machineSpec" (dict "root" $ "group" $group "name" $groupName) | nindent 6 }}
{{- end }}
