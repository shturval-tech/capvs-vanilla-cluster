{{- include "capvs-vanilla-cluster.validate" . }}
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: {{ include "capvs-vanilla-cluster.clusterName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    cluster.x-k8s.io/cluster-name: {{ include "capvs-vanilla-cluster.clusterName" . | quote }}
    {{- include "capvs-vanilla-cluster.labels" . | nindent 4 }}
spec:
  clusterNetwork:
    apiServerPort: 6443
    pods:
      cidrBlocks:
        - {{ required "cluster.podCIDR is required" .Values.cluster.podCIDR | quote }}
    services:
      cidrBlocks:
        - {{ required "cluster.serviceCIDR is required" .Values.cluster.serviceCIDR | quote }}
    serviceDomain: {{ required "cluster.serviceDomain is required" .Values.cluster.serviceDomain | quote }}
  controlPlaneEndpoint:
    host: {{ include "capvs-vanilla-cluster.endpointHost" . | quote }}
    port: {{ include "capvs-vanilla-cluster.endpointPort" . }}
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: {{ include "capvs-vanilla-cluster.childName" (dict "root" . "suffix" "-control-plane") }}
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: VSphereCluster
    name: {{ include "capvs-vanilla-cluster.clusterName" . }}
