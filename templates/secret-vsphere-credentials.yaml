{{- if .Values.vsphere.credentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "capvs-vanilla-cluster.credentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    cluster.x-k8s.io/cluster-name: {{ include "capvs-vanilla-cluster.clusterName" . | quote }}
    {{- include "capvs-vanilla-cluster.labels" . | nindent 4 }}
  {{- if .Values.vsphere.credentials.keepOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
stringData:
  username: {{ required "vsphere.username is required" .Values.vsphere.username | quote }}
  password: {{ required "vsphere.password is required" .Values.vsphere.password | quote }}
{{- end }}
