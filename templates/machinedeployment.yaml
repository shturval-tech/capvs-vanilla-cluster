{{- range $groupName, $group := .Values.workerNodes }}
{{- $name := include "capv-cluster.childName" (dict "root" $ "suffix" (printf "-%s" $groupName)) }}
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    cluster.x-k8s.io/cluster-name: {{ include "capv-cluster.clusterName" $ | quote }}
    cluster.x-k8s.io/deployment-name: {{ $name | quote }}
    {{- include "capv-cluster.labels" $ | nindent 4 }}
spec:
  clusterName: {{ include "capv-cluster.clusterName" $ | quote }}
  replicas: {{ $group.replicas | default 0 }}
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: {{ include "capv-cluster.clusterName" $ | quote }}
      cluster.x-k8s.io/deployment-name: {{ $name | quote }}
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: {{ include "capv-cluster.clusterName" $ | quote }}
        cluster.x-k8s.io/deployment-name: {{ $name | quote }}
      {{- with $group.templateAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      clusterName: {{ include "capv-cluster.clusterName" $ | quote }}
      version: v{{ include "capv-cluster.kubernetesVersion" $ }}
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: {{ $name }}
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: VSphereMachineTemplate
        name: {{ $name }}
      deletion:
        nodeDeletionTimeoutSeconds: {{ ($group.deletion | default dict).nodeDeletionTimeoutSeconds | default 600 }}
        nodeDrainTimeoutSeconds: {{ ($group.deletion | default dict).nodeDrainTimeoutSeconds | default 600 }}
        nodeVolumeDetachTimeoutSeconds: {{ ($group.deletion | default dict).nodeVolumeDetachTimeoutSeconds | default 300 }}
  rollout:
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: {{ ($group.rollout | default dict).maxSurge | default 1 }}
        maxUnavailable: {{ ($group.rollout | default dict).maxUnavailable | default 0 }}
{{- end }}
