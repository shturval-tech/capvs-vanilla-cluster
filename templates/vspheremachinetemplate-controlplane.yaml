apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: VSphereMachineTemplate
metadata:
  name: {{ include "capv-cluster.childName" (dict "root" . "suffix" "-control-plane") }}
  namespace: {{ .Release.Namespace }}
  labels:
    cluster.x-k8s.io/cluster-name: {{ include "capv-cluster.clusterName" . | quote }}
    cluster.x-k8s.io/control-plane: "true"
    {{- include "capv-cluster.labels" . | nindent 4 }}
spec:
  template:
    spec:
      {{- include "capv-cluster.machineSpec" (dict "root" . "group" .Values.controlPlane "name" "control-plane") | nindent 6 }}
